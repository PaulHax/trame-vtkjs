[project]
name = "trame-vtkjs"
# hatch_build.py resolves a public release version, a source distribution's
# preserved version, or a development version stamped with the Git revision.
dynamic = ["version"]
description = "vtk.js scene replication and shared-context rendering for trame"
authors = [
    {name = "Kitware Inc."},
    {name = "Paul Elliott"},
]
dependencies = [
    "trame",
    "trame-common",
]
requires-python = ">=3.9"
readme = "README.md"
license = {text = "Apache Software License"}
keywords = ["Python", "Interactive", "Web", "Application", "Framework"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Repository = "https://github.com/PaulHax/trame-vtkjs"
Issues = "https://github.com/PaulHax/trame-vtkjs/issues"

[project.optional-dependencies]
vtk = [
    # 9.6 is the first VTK that ships a serializer for vtkPointGaussianMapper.
    # Older wheels resolve the mapper to vtkOpenGLPointGaussianMapper and then
    # fail to add its state, so every point-cloud anchor silently drops off the
    # wire instead of raising.
    # The fork is qualified against 9.6. VTK 9.7 changes serialized scene
    # properties and needs separate client reconciliation work.
    "vtk>=9.6,<9.7",
]
dev = [
    "mypy",
    "pre-commit",
    "ruff",
    "pytest",
    "pytest-asyncio",
    "trame-client[test]",
]

[build-system]
requires = ["hatchling", "packaging>=24.2"]
build-backend = "hatchling.build"

# Public releases provide TRAME_VTKJS_RELEASE_VERSION; development uses Git.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build]
include = [
  "/CONTRIBUTING.md",
  "/docs/**/*.md",
  "/src/trame_vtkjs/**/*.py",
  "/src/trame_vtkjs/py.typed",
  # Ship the vtk.js bundle plus the offline 3D Tiles decode runtime.
  "/src/trame_vtkjs/module/serve/js/**",
  "/src/trame_vtkjs/module/serve/wasm/tiles3d/**",
  "/src/trame/**/*.py",
]
# The wheel ships every file under its `packages` (below), whatever `include`
# says, so serve/wasm/ is limited to the offline 3D Tiles decoders.
exclude = [
  "/src/**/.gitignore",
  "/src/trame_vtkjs/module/serve/wasm/*",
  "!/src/trame_vtkjs/module/serve/wasm/tiles3d",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/trame_vtkjs",
    "src/trame",
]

[tool.semantic_release]
commit_parser = "conventional"
tag_format = "trame-vtkjs-v{version}"
allow_zero_version = true
major_on_zero = false
version_toml = []
version_variables = []

[tool.trame_vtkjs.release]
initial_version = "0.1.0"
baseline_commit = "ccad1d7fcde045ff05aca143e0d072b517d4b972"

[tool.hatch.build.targets.sdist.force-include]
"hatch_build.py" = "hatch_build.py"

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py39"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
# ``tests/push_oracle_e2e`` modules import ``from tests.push_oracle...`` which
# requires the repo root on sys.path. ``pythonpath = ["."]`` makes that
# explicit instead of depending on pytest's incidental rootdir discovery.
pythonpath = ["."]
markers = [
    "js_oracle: end-to-end Playwright push-sync oracle (~30s; needs Playwright + Chromium). Skip with -m 'not js_oracle' if Playwright isn't installed.",
]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []
fixable = ["ALL"]
unfixable = []


[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pycodestyle]
max-line-length = 120

[tool.mypy]
# mypy cannot target 3.9; every module uses postponed annotation evaluation, so
# annotations stay valid on the 3.9 runtime floor.
python_version = "3.10"
files = ["src"]
mypy_path = "src"
explicit_package_bases = true
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
# VTK's pure-Python numpy bridge carries no annotations inside its typed package.
untyped_calls_exclude = ["vtkmodules.util.numpy_support"]

# These trame and wslink distributions ship no PEP 561 marker.
[[tool.mypy.overrides]]
module = [
    "trame",
    "trame.*",
    "trame_client",
    "trame_client.*",
    "trame_common",
    "trame_common.*",
    "trame_server",
    "trame_server.*",
    "wslink",
    "wslink.*",
]
ignore_missing_imports = true
